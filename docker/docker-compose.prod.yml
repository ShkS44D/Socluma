services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - application_data:/var/lib/socluma
    environment: &backend_environment
      - ENVIRONMENT=production
      - DEBUG=false
      - DOCS_ENABLED=false
      - SECURE_COOKIE=true
      - AUTH_EMAIL_CAPTURE=false
      - AUTH_DEV_EXPOSE_TOKENS=false
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:?FRONTEND_PUBLIC_URL must be an HTTPS URL}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-false}
      - AUDIT_ARCHIVE_DIRECTORY=/var/lib/socluma/audit-archives
      - AUDIT_EXPORT_DIRECTORY=/var/lib/socluma/audit-exports
      - IOC_COMMERCIAL_ARTIFACT_DIRECTORY=/var/lib/socluma/ioc-artifacts
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - USE_SQLITE=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS_MOCK=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      - COLLECTOR_TOKEN_SECRET=${COLLECTOR_TOKEN_SECRET:?COLLECTOR_TOKEN_SECRET is required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS is required}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_PATH=${METRICS_PATH:-/metrics}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-200/minute}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6-luna}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-60}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-2000}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-medium}
      - CORRELATION_WINDOW_MINUTES=${CORRELATION_WINDOW_MINUTES:-15}
      - CORRELATION_MIN_SCORE=${CORRELATION_MIN_SCORE:-45}
      - CORRELATION_MIN_ALERTS=${CORRELATION_MIN_ALERTS:-2}
      - CORRELATION_ALLOW_REPEATED_ALERTS=${CORRELATION_ALLOW_REPEATED_ALERTS:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    command: celery -A src.workers.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - application_data:/var/lib/socluma
    environment: *backend_environment
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  scheduler:
    extends:
      service: worker
    command: celery -A src.workers.celery_app.celery_app beat --loglevel=INFO --schedule=/var/lib/socluma/celerybeat-schedule
    healthcheck:
      disable: true

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  application_data:
  postgres_data:
  redis_data:
