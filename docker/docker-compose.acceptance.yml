services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vigilantai_acceptance
      POSTGRES_PASSWORD: ${ACCEPTANCE_POSTGRES_PASSWORD:?set ACCEPTANCE_POSTGRES_PASSWORD}
      POSTGRES_DB: vigilantai_acceptance
    volumes:
      - acceptance_postgres_data:/var/lib/postgresql/data
    ports:
      - "${ACCEPTANCE_POSTGRES_PORT:?set ACCEPTANCE_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilantai_acceptance -d vigilantai_acceptance"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - acceptance_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "${ACCEPTANCE_BACKEND_PORT:?set ACCEPTANCE_BACKEND_PORT}:8000"
    environment: &backend_environment
      ENVIRONMENT: development
      USE_SQLITE: "false"
      POSTGRES_SERVER: db
      POSTGRES_USER: vigilantai_acceptance
      POSTGRES_PASSWORD: ${ACCEPTANCE_POSTGRES_PASSWORD:?set ACCEPTANCE_POSTGRES_PASSWORD}
      POSTGRES_DB: vigilantai_acceptance
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      USE_REDIS_MOCK: "false"
      SECRET_KEY: ${ACCEPTANCE_SECRET_KEY:?set ACCEPTANCE_SECRET_KEY}
      JWT_SECRET_KEY: ${ACCEPTANCE_JWT_SECRET_KEY:?set ACCEPTANCE_JWT_SECRET_KEY}
      REFRESH_TOKEN_SECRET: ${ACCEPTANCE_REFRESH_TOKEN_SECRET:?set ACCEPTANCE_REFRESH_TOKEN_SECRET}
      COLLECTOR_TOKEN_SECRET: ${ACCEPTANCE_COLLECTOR_TOKEN_SECRET:?set ACCEPTANCE_COLLECTOR_TOKEN_SECRET}
      ADMIN_EMAIL: ${ACCEPTANCE_ADMIN_EMAIL:?set ACCEPTANCE_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ACCEPTANCE_ADMIN_PASSWORD:?set ACCEPTANCE_ADMIN_PASSWORD}
      BACKEND_CORS_ORIGINS: '["http://127.0.0.1:${ACCEPTANCE_FRONTEND_PORT}","http://localhost:${ACCEPTANCE_FRONTEND_PORT}"]'
      OPENAI_API_KEY: ""
      OTX_API_KEY: ""
      ABUSEIPDB_API_KEY: ""
      VIRUSTOTAL_API_KEY: ""
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A src.workers.celery_app.celery_app worker --loglevel=INFO --uid=nobody --gid=nogroup
    environment: *backend_environment
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${ACCEPTANCE_FRONTEND_PORT:?set ACCEPTANCE_FRONTEND_PORT}:3000"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:${ACCEPTANCE_BACKEND_PORT}
    depends_on:
      backend: { condition: service_healthy }

volumes:
  acceptance_postgres_data:
  acceptance_redis_data:
